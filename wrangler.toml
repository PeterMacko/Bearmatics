# Equivalent TOML configuration. Keep in sync with canonical wrangler.jsonc.
# Wrangler discovers JSONC before TOML; select this file with --config wrangler.toml.
"$schema" = "node_modules/wrangler/config-schema.json"
name = "bearmatics"
main = "worker/index.ts"
compatibility_date = "2026-11-09"

# Static app as before; only /api reaches the server script (SCRUM-96).
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]

# Live database. Previews use their own database, local dev a local file.
[[d1_databases]]
binding = "DB"
database_name = "bearmatics"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[previews.d1_databases]]
binding = "DB"
database_name = "bearmatics-preview"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "migrations"

[observability.logs]
enabled = true
invocation_logs = true
persist = true
